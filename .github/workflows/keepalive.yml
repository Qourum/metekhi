# The online mode's rooms live on a free Supabase project, which is paused after a week without use. Once a day this
# calls the project's ping counter (the same public key the game uses; it can only add one to today's count).
name: keep the online rooms awake
on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:
permissions: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: ping
        run: |
          curl -fsS -X POST 'https://wnpqmcucnqcpcceqwega.supabase.co/rest/v1/rpc/ping' \
            -H 'apikey: sb_publishable_DEGb_dkdj1s3QEJFrxc-Aw_apfCzfNx' \
            -H 'Content-Type: application/json' -d '{}'
